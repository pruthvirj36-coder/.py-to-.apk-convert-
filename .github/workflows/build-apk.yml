name: Build Flet Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y basic256 ninja-build libgtk-3-dev libblkid-dev liblzma-dev

      - name: Install Python Package Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet sqlite3-sig

      - name: Execute Flet Android Compilation
        run: |
          # Bootstrap Flet CLI build ecosystem
          flet build apk --no-public-signing

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dpsp-legacy-command-apk
          path: build/apk/*.apk
          retention-days: 7
          
